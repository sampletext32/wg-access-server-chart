{{- if and .Values.amnezia.enabled (not .Values.amnezia.server.headerProtectionKey) (not .Values.amnezia.server.existingSecret) }}
{{- fail "amnezia.enabled needs a header protection key: set amnezia.server.headerProtectionKey or amnezia.server.existingSecret" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wg-access-server.name" . }}
  labels:
    {{- include "wg-access-server.labels" . | nindent 4 }}
data:
  config.yaml: |-
{{- if .Values.config }}
{{ toYaml .Values.config | indent 4 }}
{{- end }}
{{- if .Values.amnezia.enabled }}
    amnezia:
{{ toYaml (dict "shared" .Values.amnezia.shared) | indent 6 }}
{{- with .Values.amnezia.client }}
{{ toYaml (dict "client" .) | indent 6 }}
{{- end }}
{{- end }}
